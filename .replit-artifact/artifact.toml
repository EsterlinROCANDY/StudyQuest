kind = "web"
previewPath = "/"
title = "StudyQuest"
version = "1.0.0"
id = "artifacts/study-quest"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18651

[services.development]
run = "pnpm --filter @workspace/study-quest run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/study-quest", "run", "build" ]
publicDir = "artifacts/study-quest/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18651"
BASE_PATH = "/"
